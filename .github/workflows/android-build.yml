
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        run: |
          if [ ! -f ./gradlew ]; then
            echo "Missing Android Studio source project"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKKT-APK
          path: '**/build/outputs/apk/release/*.apk'
